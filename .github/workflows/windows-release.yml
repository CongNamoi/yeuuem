name: Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example v0.1.0-touch-preview)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: windows-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test and publish
        shell: pwsh
        run: |
          dotnet test ./tests/PhoneBridge.Core.Tests -c Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet publish ./src/PhoneBridge.Wpf/PhoneBridge.Wpf.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./package/PhoneBridge
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Remove-Item ./package/PhoneBridge/*.pdb -ErrorAction SilentlyContinue
          Copy-Item ./README.md ./package/PhoneBridge/README.md
          Compress-Archive -Path ./package/PhoneBridge -DestinationPath ./PhoneBridge-win-x64.zip
          $hash = (Get-FileHash ./PhoneBridge-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  PhoneBridge-win-x64.zip" | Set-Content ./PhoneBridge-win-x64.zip.sha256 -Encoding ascii
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9][A-Za-z0-9.-]*)?$') {
            throw "Release tag must be a version starting with v."
          }

          $release = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft,assets 2>$null
          if ($LASTEXITCODE) {
            gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --draft --prerelease --title "PhoneBridge $env:RELEASE_TAG" --notes "Windows x64 portable build. Copy your tools folder beside PhoneBridge.exe."
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          } elseif (-not ($release | ConvertFrom-Json).isDraft) {
            throw "This release is already published. Use a new tag."
          }

          gh release upload $env:RELEASE_TAG ./PhoneBridge-win-x64.zip ./PhoneBridge-win-x64.zip.sha256 --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=false
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
